format = 4
id = "github.com/MiracleForest/Lepton"
version = "0.1.1"

[info]
name = "Lepton"
description = "Quark for Minecraft Bedrock Edition: small vanilla+ improvements, each one a module you can turn off"
tags = ["game-mechanics", "utility", "vanilla-plus"]
logo = "https://raw.githubusercontent.com/MiracleForest/Lepton/main/docs/logo.png"

# Lepton is compiled against one LeviLamina line at a time, so every supported line is a variant
# named after it: 26_51 for LeviLamina 26.51.x (Minecraft 1.26.51), 26_60 for 26.60.x
# (Minecraft 1.26.60). Variant names may only hold [a-z0-9_], hence 26_60 and not 26.60. Each
# line has a server entry (dedicated server) and a client entry (LeviLauncher).
#
# The default variant and the variant "client", which is the one LeviLauncher reaches for first
# and the one earlier releases of the client mod were installed as, are the newest supported line.
#
# LeviLamina 26.60 loads the mods of a dedicated server from mods/, like the client, so its server
# entries are mcmod assets. LeviLamina 26.51 loads them from plugins/, so the 26_51 server entry
# places the same kind of archive into plugins/Lepton/ itself.

# --- 26.60 (Minecraft 1.26.60) ------------------------------------------------------------------

[[variants.""]]
side = "server"
platform = "win-x64"
preserve = ["mods/Lepton/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-server-win-x64-ll26.60.zip"]

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/Lepton/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-client-win-x64-ll26.60.zip"]

[[variants.client]]
side = "client"
platform = "win-x64"
preserve = ["mods/Lepton/config/"]

[variants.client.deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants.client.assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-client-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "server"
platform = "win-x64"
preserve = ["mods/Lepton/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-server-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "client"
platform = "win-x64"
preserve = ["mods/Lepton/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-client-win-x64-ll26.60.zip"]

# --- 26.51 (Minecraft 1.26.51) ------------------------------------------------------------------

[[variants."26_51"]]
side = "server"
platform = "win-x64"
preserve = ["plugins/Lepton/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina" = "26.51.*"

[[variants."26_51".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-server-win-x64-ll26.51.zip"]
place = [{ src = "", dest = "plugins/Lepton/" }]

[[variants."26_51"]]
side = "client"
platform = "win-x64"
preserve = ["mods/Lepton/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."26_51".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/lepton-client-win-x64-ll26.51.zip"]
